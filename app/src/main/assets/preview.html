<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<audio id="previewAudio" loop></audio>
<script src="wemogg.js"></script>
<script>
// Cầu nối JS <-> Android.
//
// LÝ DO PHÁT AUDIO NGAY TRONG WEBVIEW (không trả bytes .ogg ra native
// MediaPlayer nữa): file .ogg do wemToOgg() TỰ DỰNG LẠI container có thể
// đủ hợp lệ để trình duyệt phát (rất khoan dung với Ogg hơi lệch chuẩn)
// nhưng KHÔNG đủ chuẩn để Android MediaPlayer chấp nhận toàn bộ — quan sát
// thực tế: phát được vài giây đầu rồi lỗi MEDIA_ERROR_UNKNOWN giữa chừng.
// Giữ cả giải mã LẪN phát nhạc trong cùng 1 engine (trình duyệt) — nơi
// wemogg.js vốn được kiểm chứng hoạt động đúng trên web — loại bỏ hẳn phụ
// thuộc vào độ khắt khe của trình phát native.

var currentAudioUrl = null;

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// Gọi từ Android: webView.evaluateJavascript("playWemBase64('" + b64 + "')", null)
// Giải mã .wem -> Ogg rồi PHÁT LUÔN bằng thẻ <audio> của chính WebView —
// không trả bytes ra ngoài native nữa. Báo lỗi/callback qua AndroidBridge.
function playWemBase64(wemBase64) {
  try {
    const wemBuf = base64ToArrayBuffer(wemBase64);
    const wemBytes = new Uint8Array(wemBuf);
    const oggBytes = window.wemToOgg(wemBytes); // codebook mặc định đã nhúng sẵn trong file

    const blob = new Blob([oggBytes], { type: 'audio/ogg' });
    if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl); // dọn URL cũ, tránh rò rỉ bộ nhớ
    currentAudioUrl = URL.createObjectURL(blob);

    const audio = document.getElementById('previewAudio');
    audio.src = currentAudioUrl;
    audio.loop = true;
    audio.currentTime = 0;
    audio.play()
      .then(() => { if (window.AndroidBridge) AndroidBridge.onPlaybackStarted(); })
      .catch(err => { if (window.AndroidBridge) AndroidBridge.onError('play() thất bại: ' + err); });
  } catch (err) {
    if (window.AndroidBridge) AndroidBridge.onError(String(err && err.message ? err.message : err));
  }
}

function stopWemAudio() {
  const audio = document.getElementById('previewAudio');
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
}
</script>
</body>
</html>
