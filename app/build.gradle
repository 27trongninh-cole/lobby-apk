plugins {
    id 'com.android.application'
}

android {
    namespace 'com.echohall.kgvn'
    compileSdk 34

    defaultConfig {
        applicationId "com.echohall.kgvn"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0-test"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Build test trước — chưa ký release, dùng debug key mặc định của Android Studio.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Shizuku: xin quyền + chạy lệnh shell không cần root
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Giải nén file zip mod tải từ web
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
}
