plugins {
    id 'com.android.application'
}

android {
    namespace 'com.echohall.kgvn'
    compileSdk 34

    defaultConfig {
        applicationId "com.echohall.kgvn"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // libmwem.so (encoder wav/mp3/ogg -> .wem, port từ w2wtest) chỉ build
        // sẵn cho arm64-v8a — giới hạn app chỉ chạy trên thiết bị arm64 (đa số
        // máy Android hiện nay). Nếu sau này có thêm .so cho armeabi-v7a thì
        // thêm vào đây.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Keystore CỐ ĐỊNH, commit thẳng vào repo (app/melo-release.keystore) —
    // dùng chung cho MỌI lần build (local lẫn CI). Trước đây build debug
    // dùng debug key TỰ SINH của từng máy/runner -> mỗi lần build lại (kể cả
    // trên GitHub Actions, runner mới mỗi lần) là 1 chữ ký khác -> (1)
    // Device ID tự sinh trong DeviceLicense không bị ảnh hưởng (đã đổi sang
    // UUID riêng, không phụ thuộc chữ ký), NHƯNG (2) cài bản mới đè lên bản
    // cũ vẫn báo lỗi "xung đột chữ ký / app not installed" vì Android coi 2
    // chữ ký khác nhau là 2 app khác nhau. Dùng 1 keystore cố định giải quyết
    // dứt điểm vấn đề (2). Đây KHÔNG phải keystore bí mật/nhạy cảm (app nội
    // bộ dùng giữa bạn bè, không phát hành CH Play) nên commit thẳng vào
    // repo là chấp nhận được, không cần GitHub Secrets.
    signingConfigs {
        melo {
            storeFile file("melo-release.keystore")
            storePassword "melo-ninstaller-2026"
            keyAlias "melo"
            keyPassword "melo-ninstaller-2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.melo
        }
        debug {
            // Trước đây dùng debug key mặc định (tự sinh, đổi mỗi máy/mỗi
            // lần CI build) — giờ dùng chung keystore cố định ở trên để cài
            // đè bản mới lên bản cũ không bị lỗi xung đột chữ ký.
            signingConfig signingConfigs.melo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Shizuku: xin quyền + chạy lệnh shell không cần root
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Giải nén file zip mod tải từ web
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Lưới chọn nhạc/video (thay AlertDialog.setItems bằng UI dạng lưới có
    // thumbnail + tìm kiếm, giống trang web).
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Tải thumbnail_url (ảnh) cho lưới video, giống <img> trên web.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
