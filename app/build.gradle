plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ninfinity.aovmapmod'
    compileSdk 35

    defaultConfig {
        applicationId "com.ninfinity.aovmapmod"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            // Chaquopy build cho các kiến trúc CPU thông dụng nhất trên điện thoại Android
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            // Các thư viện Python cần cho AssetbundleUtils/UnityPy_AOV + xử lý ảnh
            pip {
                install "Pillow"
                install "UnityPy"
                // Nếu UnityPy_AOV là package tùy biến riêng (không có trên PyPI),
                // copy trực tiếp source vào app/src/main/python thay vì pip install.
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug build: không cần ký release key, dùng để tự cài & test
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    // Load ảnh từ Supabase Storage (URL) vào Compose
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Gọi API / tải file lên Supabase Storage nếu cần (tùy chọn — hiện tại rebuild chạy local qua Chaquopy)
    implementation 'io.ktor:ktor-client-android:2.3.12'
    implementation 'io.ktor:ktor-client-content-negotiation:2.3.12'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
