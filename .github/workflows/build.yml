name: Build Melo Ninstaller APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write   # cần để job release tạo GitHub Release + upload file đính kèm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Repo này CHƯA commit gradle-wrapper.jar (binary, không tạo được ở môi
      # trường soạn code offline lúc đầu) — dùng action cài thẳng Gradle lên
      # runner, khỏi cần wrapper. Nếu sau này bạn tự chạy `gradle wrapper` và
      # commit thư mục gradle/wrapper/ đầy đủ, có thể đổi bước dưới thành
      # `./gradlew assembleDebug` và bỏ bước setup-gradle này.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Đổi tên file .apk gốc (thường dạng app-debug.apk) thành tên hiển thị
      # mong muốn — chỉ đổi TÊN FILE, android:label trong AndroidManifest đã
      # là "Melo Ninstaller" từ trước, khớp nhau.
      - name: Rename APK to "Melo Ninstaller.apk"
        run: |
          mkdir -p release-out
          src=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$src" ]; then echo "Không tìm thấy file .apk sau khi build"; exit 1; fi
          cp "$src" "release-out/Melo Ninstaller.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: melo-ninstaller-apk
          path: release-out/Melo Ninstaller.apk
          if-no-files-found: error

      # Tự tạo 1 GitHub Release mới cho mỗi lần build, đính kèm file .apk để
      # tải trực tiếp từ tab Releases (không cần vào Actions > Artifacts).
      #
      # LƯU Ý QUAN TRỌNG: dù app giờ là bản CHÍNH THỨC (v1.0.0, không còn
      # test), file .apk build ra ở đây VẪN đang ký bằng debug key mặc định
      # của Android Gradle Plugin — chưa có keystore release riêng. Ký bằng
      # debug key vẫn cài/dùng được bình thường, nhưng: (1) không đúng chuẩn
      # phát hành chính thức, (2) mỗi máy build lại có thể dùng debug
      # keystore khác nhau → cài đè lên bản cũ có thể lỗi "chữ ký không khớp"
      # nếu build ở máy/runner khác. Nếu cần phát hành thật sự ổn định lâu
      # dài, nên tạo keystore riêng, lưu vào GitHub Secrets, và thêm bước ký
      # (apksigner) trước bước release này.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Melo Ninstaller v1.0.0 (build #${{ github.run_number }})"
          body: |
            Bản chính thức v1.0.0 — build tự động từ commit ${{ github.sha }}.
            Lưu ý: vẫn ký bằng debug key (chưa có keystore release riêng).
          files: release-out/Melo Ninstaller.apk

