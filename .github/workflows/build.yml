name: Build debug APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Repo này CHƯA commit gradle-wrapper.jar (binary, không tạo được ở môi
      # trường soạn code offline lúc đầu) — dùng action cài thẳng Gradle lên
      # runner, khỏi cần wrapper. Nếu sau này bạn tự chạy `gradle wrapper` và
      # commit thư mục gradle/wrapper/ đầy đủ, có thể đổi bước dưới thành
      # `./gradlew assembleDebug` và bỏ bước setup-gradle này.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: echohall-installer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
